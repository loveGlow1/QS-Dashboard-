<!DOCTYPE html>
<html lang="en" data-qs-root="..">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transactions — QuickStark</title>
<meta name="description" content="Every deposit, investment, return and withdrawal on your account.">
<meta name="theme-color" content="#060a16">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

<body class="qs-app">

<a class="qs-skip" href="#qs-main">Skip to content</a>

<!-- Sidebar, topbar and bottom navigation are rendered by app-shell.js from
     one definition, so routes cannot drift between them. -->
<div class="qs-shell" data-app-shell>

  <main class="qs-main" id="qs-main">

    <section class="qs-pagehead">
      <div>
        <h1 class="qs-h1">Transactions</h1>
        <p>Every entry on your account, newest first.</p>
      </div>
      <dl class="qs-pagehead__stats">
        <div><dt>Available balance</dt><dd class="qs-num" data-available>—</dd></div>
        <div><dt>Pending out</dt><dd class="qs-num" data-pending>—</dd></div>
      </dl>
    </section>

    <section class="qs-card" aria-labelledby="qs-ledger-title">
      <header class="qs-card__head qs-card__head--wrap">
        <h2 class="qs-h3" id="qs-ledger-title">Statement</h2>
        <div class="qs-ranges" data-txn-filters role="tablist" aria-label="Filter by type"></div>
      </header>
      <div data-txn-list></div>
    </section>

  </main>

</div>

<script src="../assets/vendor/supabase.js"></script>

<script src="../assets/js/components/reveal.js"></script>

<script src="../assets/js/core/bootstrap.js"></script>
<script src="../assets/js/pages/_page.js"></script>
<script src="../assets/js/pages/transactions.js"></script>
</body>
</html>
